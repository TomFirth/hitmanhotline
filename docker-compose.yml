services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hitmanhotline-server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: "file:/app/prisma/dev.db"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/prisma/dev.db:/app/prisma/dev.db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hitmanhotline-client
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      REACT_APP_API_URL: http://server:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
